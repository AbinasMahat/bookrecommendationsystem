<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System | BRS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e57c2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .landing-container {
            text-align: center;
            padding: 50px 40px;
            max-width: 700px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .landing-container h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .landing-container p {
            font-size: 1.25rem;
            margin-bottom: 45px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .landing-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-custom {
            background: white;
            color: #1e3c72;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn-primary-custom:hover {
            background: #f8f9fa;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            color: #1e3c72;
        }

        .btn-outline-custom {
            border: 2px solid white;
            color: white;
            background: transparent;
        }

        .btn-outline-custom:hover {
            background: white;
            color: #1e3c72;
            transform: translateY(-3px);
        }

        .features {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            opacity: 0.85;
        }

        .feature-item {
            font-size: 0.95rem;
        }

        .feature-item i {
            margin-right: 6px;
            color: #ffd700;
        }

        @media (max-width: 576px) {
            .landing-container h1 {
                font-size: 2.3rem;
            }
            .landing-container p {
                font-size: 1.05rem;
            }
            .btn-custom {
                padding: 12px 30px;
                width: 80%;
                justify-content: center;
            }
        }
    </style>
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
</head>
<body>

    <div class="landing-container">
        <div class="brand-icon">
            <i class="fas fa-book-open"></i>
        </div>

        <h1>Book Recommendation System</h1>
        <p>
            Discover your next favorite book with powerful<br>
            <strong>SVD + Hybrid Recommendation Algorithms</strong>
        </p>

        <div class="landing-buttons">
            <a href="{{ url_for('login') }}" class="btn-custom btn-primary-custom">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <a href="{{ url_for('register') }}" class="btn-custom btn-outline-custom">
                <i class="fas fa-user-plus"></i> Register
            </a>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fas fa-brain"></i> SVD Matrix Factorization
            </div>
            <div class="feature-item">
                <i class="fas fa-random"></i> Hybrid Recommender
            </div>
            <div class="feature-item">
                <i class="fas fa-star"></i> Smart Ratings
            </div>
        </div>
    </div>

</body>
</html>
