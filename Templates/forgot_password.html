<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Book Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .recovery-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .recovery-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: var(--paper-deep);
            color: var(--green);
            font-size: 1.35rem;
        }
        .recovery-card h2 { color: var(--green-dark); font-weight: 700; }
        .recovery-card .btn-login { width: 100%; }
    </style>
</head>
<body>
    <main class="recovery-card">
        <div class="text-center mb-4">
            <div class="recovery-icon"><i class="fas fa-key"></i></div>
            <h2>Reset your password</h2>
            <p class="text-muted mb-0">Verify your account, then choose a new password.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input id="username" type="text" name="username" class="form-control" placeholder="Your username" required autocomplete="username">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Registered email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input id="email" type="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">New password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input id="password" type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirm_password">Confirm new password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input id="confirm_password" type="password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-shield-halved"></i> Update Password
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" class="text-decoration-none">
                <i class="fas fa-arrow-left"></i> Back to login
            </a>
        </div>
    </main>
</body>
</html>
